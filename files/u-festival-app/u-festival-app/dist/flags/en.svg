<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 30">
  <!-- UK Union Jack -->
  <!-- Blue background -->
  <rect width="60" height="30" fill="#012169"/>

  <!-- White diagonal cross (St Andrew) -->
  <path d="M0,0 L60,30 M60,0 L0,30" stroke="#FFFFFF" stroke-width="6"/>

  <!-- Red diagonal cross (St Patrick) — narrower, on top -->
  <path d="M0,0 L60,30" stroke="#C8102E" stroke-width="4"/>
  <path d="M60,0 L0,30" stroke="#C8102E" stroke-width="4"/>

  <!-- White vertical cross (fimbriation for St George) -->
  <path d="M30,0 V30 M0,15 H60" stroke="#FFFFFF" stroke-width="10"/>

  <!-- Red vertical cross (St George) -->
  <path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/>
</svg>
